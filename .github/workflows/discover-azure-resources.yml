name: Discover Azure Resources

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  discover:
    name: Discover Available Resources
    runs-on: ubuntu-latest
    
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_APP_ID }}",
            "clientSecret": "${{ secrets.AZURE_PASSWORD }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }
    
    - name: Show Subscription Info
      run: |
        echo "=== SUBSCRIPTION INFO ==="
        az account show --output table
    
    - name: List All Resource Groups
      run: |
        echo "=== AVAILABLE RESOURCE GROUPS ==="
        az group list --query "[].{Name:name, Location:location, Tags:tags}" --output table
    
    - name: List All Resources
      run: |
        echo "=== ALL RESOURCES YOU CAN ACCESS ==="
        az resource list --query "[].{Name:name, Type:type, ResourceGroup:resourceGroup, Location:location}" --output table
    
    - name: Check Container Registries
      run: |
        echo "=== CONTAINER REGISTRIES ==="
        az acr list --query "[].{Name:name, ResourceGroup:resourceGroup, LoginServer:loginServer}" --output table || echo "No ACRs found or no permission"
    
    - name: Check App Services
      run: |
        echo "=== APP SERVICES ==="
        az webapp list --query "[].{Name:name, ResourceGroup:resourceGroup, DefaultHostName:defaultHostName, State:state}" --output table || echo "No App Services found or no permission"
    
    - name: Check Role Assignments
      run: |
        echo "=== YOUR PERMISSIONS ==="
        az role assignment list --assignee ${{ secrets.AZURE_APP_ID }} --query "[].{Role:roleDefinitionName, Scope:scope}" --output table || echo "Cannot list role assignments"