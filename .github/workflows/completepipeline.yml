name: CI/CD Pipeline - Recipe App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  RESOURCE_GROUP: BCSAI2025-DEVOPS-STUDENTS-A
  LOCATION: westeurope
  OWNER: geethika
  APP_NAME: app-geethika-recipe
  APP_PLAN: plan-geethika-dev

jobs:
  # CI Job: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run tests (if you have tests)
      run: |
        # Add your test commands here
        # python -m pytest tests/
        # python manage.py test
        echo "Running tests..."
        # For now, just a placeholder
    
    - name: Build application
      run: |
        echo "Building application..."
        # Add any build steps needed (e.g., npm build for frontend)
    
    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v3
      with:
        name: recipe-app
        path: .

  # CD Job: Deploy to Azure (only on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v3
      with:
        name: recipe-app
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_APP_ID }}",
            "clientSecret": "${{ secrets.AZURE_PASSWORD }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }
    
    - name: Create App Service Plan (if not exists)
      run: |
        # Check if plan exists
        if ! az appservice plan show --name ${{ env.APP_PLAN }} --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
          echo "Creating App Service Plan..."
          az appservice plan create \
            --name ${{ env.APP_PLAN }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --sku F1 \
            --is-linux \
            --tags owner=${{ env.OWNER }} environment=dev
        else
          echo "App Service Plan already exists"
        fi
    
    - name: Create Web App (if not exists)
      run: |
        # Check if web app exists
        if ! az webapp show --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
          echo "Creating Web App..."
          az webapp create \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --plan ${{ env.APP_PLAN }} \
            --runtime "PYTHON:3.11" \
            --tags owner=${{ env.OWNER }} environment=dev
        else
          echo "Web App already exists"
        fi
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.APP_NAME }}
        package: .
    
    - name: Display deployment URL
      run: |
        echo "🚀 Application deployed successfully!"
        echo "URL: https://${{ env.APP_NAME }}.azurewebsites.net"
    
    - name: Azure Logout
      run: az logout
      if: always()