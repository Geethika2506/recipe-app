name: CI/CD Pipeline - Recipe App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  RESOURCE_GROUP: BCSAI2025-DEVOPS-STUDENTS-A
  LOCATION: northeurope
  OWNER: geethika
  APP_NAME: app-geethika-recipe
  APP_PLAN: plan-geethika-dev

jobs:
  # CI Job: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run tests (if you have tests)
      run: |
        # Add your test commands here
        # python -m pytest tests/
        # python manage.py test
        echo "Running tests..."
        # For now, just a placeholder
    
    - name: Build application
      run: |
        echo "Building application..."
        # Add any build steps needed (e.g., npm build for frontend)
    
    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: recipe-app
        path: .

  # CD Job: Deploy to Azure (only on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: recipe-app
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_APP_ID }}",
            "clientSecret": "${{ secrets.AZURE_PASSWORD }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }

    - name: List existing App Service Plans
      run: |
        echo "Checking existing App Service Plans..."
        az appservice plan list \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --output table
    
    - name: Create or Use App Service Plan
      run: |
        # Try to use an existing plan first
        EXISTING_PLAN=$(az appservice plan list \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "[?tags.owner=='${{ env.OWNER }}'].name | [0]" \
          --output tsv)
        
        if [ -z "$EXISTING_PLAN" ]; then
          echo "No existing plan found for ${{ env.OWNER }}"
          echo "Trying to create new plan with Basic SKU..."
          
          # Try Basic SKU instead of Free
          if az appservice plan create \
            --name ${{ env.APP_PLAN }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --sku B1 \
            --is-linux \
            --tags owner=${{ env.OWNER }} environment=dev; then
            echo "Created new Basic plan"
          else
            echo "ERROR: Could not create plan. Using shared plan as fallback."
            # Use any available plan in the resource group
            SHARED_PLAN=$(az appservice plan list \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "[0].name" \
              --output tsv)
            echo "APP_PLAN_NAME=$SHARED_PLAN" >> $GITHUB_ENV
          fi
        else
          echo "Using existing plan: $EXISTING_PLAN"
          echo "APP_PLAN_NAME=$EXISTING_PLAN" >> $GITHUB_ENV
        fi
    
    - name: Create Web App (if not exists)
      run: |
        # Use the plan name from previous step or default
        PLAN_TO_USE="${APP_PLAN_NAME:-${{ env.APP_PLAN }}}"
        
        # Check if web app exists
        if ! az webapp show --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
          echo "Creating Web App using plan: $PLAN_TO_USE"
          az webapp create \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --plan "$PLAN_TO_USE" \
            --runtime "PYTHON:3.11" \
            --tags owner=${{ env.OWNER }} environment=dev
        else
          echo "Web App already exists"
        fi
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.APP_NAME }}
        package: .
    
    - name: Display deployment URL
      run: |
        echo "🚀 Application deployed successfully!"
        echo "URL: https://${{ env.APP_NAME }}.azurewebsites.net"
    
    - name: Azure Logout
      run: az logout
      if: always()