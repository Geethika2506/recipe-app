name: Discover Resources

on: workflow_dispatch

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
    - uses: azure/login@v1
      with:
        creds: '{"clientId":"${{ secrets.AZURE_APP_ID }}","clientSecret":"${{ secrets.AZURE_PASSWORD }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
    
    - run: |
        echo "=== RESOURCE GROUPS ==="
        az group list --output table
        echo ""
        echo "=== ALL RESOURCES ==="
        az resource list --output table
        echo ""
        echo "=== CONTAINER REGISTRIES ==="
        az acr list --output table || echo "No ACRs found"
        echo ""
        echo "=== WEB APPS ==="
        az webapp list --output table || echo "No Web Apps found"
