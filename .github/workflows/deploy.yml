name: Deploy to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_APP_ID }}",
            "clientSecret": "${{ secrets.AZURE_PASSWORD }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }
    
    # Note: Using your secret names exactly as created in GitHub
    
    - name: Azure CLI - List Resource Groups
      run: |
        az group list --output table
    
    - name: Use Existing Resource Group
      run: |
        YOUR_NAME="geethika"
        # Use the existing shared resource group
        RESOURCE_GROUP="BCSAI2025-DEVOPS-STUDENTS-A"
        
        echo "Using resource group: $RESOURCE_GROUP"
        echo "Resources will be tagged with owner=$YOUR_NAME"
    
    - name: Deploy Azure Resources (example)
      run: |
        YOUR_NAME="geethika"
        RESOURCE_GROUP="BCSAI2025-DEVOPS-STUDENTS-A"
        
        # Example: Create a storage account in the existing resource group
        # Storage account names must be globally unique and lowercase
        STORAGE_NAME="stgeethika$(date +%s)"
        
        echo "Would create storage account: $STORAGE_NAME"
        # Uncomment when ready to create:
        # az storage account create \
        #   --name $STORAGE_NAME \
        #   --resource-group $RESOURCE_GROUP \
        #   --location westeurope \
        #   --sku Standard_LRS \
        #   --tags owner=$YOUR_NAME environment=dev
    
    - name: Azure Logout
      run: |
        az logout
      if: always()